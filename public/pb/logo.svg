<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48" role="img" aria-label="بجیستو شاپ">
    <!--
        لوگوی متنی. عمداً SVG است نه PNG: در هدر روی زمینهٔ روشن و تیره یکسان
        می‌نشیند، روی نمایشگر رتینا نرم می‌ماند و حجمش چند کیلوبایت است.
    -->
    <defs>
        <linearGradient id="bsMark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3D5AFE"/>
            <stop offset="1" stop-color="#7C4DFF"/>
        </linearGradient>
    </defs>

    <!-- نشان: سبد خرید ساده‌شده که همزمان حرف «ب» را تداعی می‌کند -->
    <rect x="0" y="4" width="40" height="40" rx="12" fill="url(#bsMark)"/>
    <path d="M11 16h3.2l2.4 12.4h10.6l2.2-8.6H17.4"
          fill="none" stroke="#fff" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.6" cy="33" r="2.1" fill="#fff"/>
    <circle cx="26.4" cy="33" r="2.1" fill="#fff"/>

    <!-- نام‌واژه -->
    <text x="52" y="25" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="19" font-weight="700" fill="#0A0E2E">بجیستو شاپ</text>
    <text x="52" y="39" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="10" font-weight="500" fill="#767D99" letter-spacing="1.5">CHALAKSOFT</text>
</svg>
