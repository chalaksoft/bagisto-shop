    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00BFA5"/><stop offset="1" stop-color="#3D5AFE"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="380" fill="url(#g)"/>
    <circle cx="1040" cy="70" r="150" fill="#fff" opacity=".07"/>
